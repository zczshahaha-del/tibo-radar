[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tibo-radar"
version = "0.1.0"
description = "A local, explainable forecast radar for Codex goodwill resets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ZC" }]
dependencies = []

[project.scripts]
tibo-radar = "tibo_radar.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tibo_radar = ["static/*"]
